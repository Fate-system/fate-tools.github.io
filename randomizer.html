<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATE_TOOL // RNG_MATRIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f4f5f7; --surface: #ffffff; --text-main: #111215;
            --text-muted: #5c6470; --orange-neon: #ff5500;
            --border-tech: #dcdfe5; --font-scifi: 'Orbitron', sans-serif;
        }

        body { background-color: var(--bg); background-image: radial-gradient(var(--border-tech) 1px, transparent 1px); background-size: 20px 20px; color: var(--text-main); font-family: var(--font-scifi); max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }

        .back-btn { position: absolute; top: 2.5rem; right: 2rem; background-color: var(--orange-neon); color: #ffffff; text-decoration: none; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.8rem; clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%); }

        header { text-align: left; margin-bottom: 4rem; border-left: 3px solid var(--orange-neon); padding-left: 1.5rem; }
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; text-transform: uppercase; }

        .container { max-width: 550px; margin: 2rem auto; background: var(--surface); border: 1px solid var(--border-tech); padding: 3rem; clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%); text-align: center; }

        .config-matrix { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .config-cell { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
        input[type="number"] { background: #ffffff; border: 1px solid var(--border-tech); color: var(--text-main); font-family: var(--font-scifi); padding: 0.5rem; width: 70px; text-align: center; font-size: 1.1rem; }

        .display { font-size: 5rem; font-weight: 900; margin: 1rem 0; color: var(--orange-neon); letter-spacing: 2px; }

        .ctrl-btn { background-color: var(--text-main); color: #ffffff; border: 1px solid var(--text-main); font-family: var(--font-scifi); font-size: 0.85rem; font-weight: 700; padding: 1rem 2rem; cursor: pointer; transition: all 0.2s; width: 100%; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); }
        .ctrl-btn:hover { background-color: var(--orange-neon); border-color: var(--orange-neon); }
    </style>
</head>
<body>

   <a href="math.html" class="back-btn"><span>← BACK</span></a>

    <header>
        <h1>FATE_TOOL // RNG_MATRIX</h1>
        <p>MODULE: RANDOM_GEN_UTIL // SYSTEM: READY</p>
    </header>
    
    <div class="container">
        <h2>[ GENERATE_INTEGERS ]</h2>
        <div class="config-matrix">
            <div class="config-cell"> <input type="number" id="min" value="1"> <span>MIN_VAL</span> </div>
            <div class="config-cell"> <input type="number" id="max" value="100"> <span>MAX_VAL</span> </div>
        </div>
        <div class="display" id="result">00</div>
        <button class="ctrl-btn" onclick="roll()">GENERATE_SEQUENCE</button>
    </div>

    <script>
        function roll() {
            const min = parseInt(document.getElementById('min').value), max = parseInt(document.getElementById('max').value), res = document.getElementById('result');
            if (isNaN(min) || isNaN(max) || min >= max) { res.style.fontSize = "1.5rem"; res.innerText = "ERR_RANGE"; return; }
            res.style.fontSize = "5rem";
            res.innerText = (Math.floor(Math.random() * (max - min + 1)) + min).toString().padStart(2, '0');
        }
    </script>
</body>
</html>
