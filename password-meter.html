<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_MATRIX // PASSWORD_METER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f4f5f7; 
            --surface: #ffffff; 
            --text-main: #111215;
            --text-muted: #5c6470; 
            --orange-neon: #ff5500;
            --border-tech: #dcdfe5; 
            --font-scifi: 'Orbitron', sans-serif;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(var(--border-tech) 1px, transparent 1px); 
            background-size: 20px 20px; 
            color: var(--text-main); 
            font-family: var(--font-scifi); 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 3rem 2rem; 
        }

        .back-btn { 
            position: absolute; 
            top: 2.5rem; 
            right: 2rem; 
            background-color: var(--orange-neon); 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.6rem 1.8rem; 
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%); 
        }

        header { 
            text-align: left; 
            margin-bottom: 4rem; 
            border-left: 3px solid var(--orange-neon); 
            padding-left: 1.5rem; 
        }
        
        h1 { 
            font-size: 2.2rem; 
            font-weight: 900; 
            margin: 0; 
            text-transform: uppercase; 
        }

        .container { 
            max-width: 500px; 
            margin: 2rem auto; 
            background: var(--surface); 
            border: 1px solid var(--border-tech); 
            padding: 3rem; 
            clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%); 
            text-align: left; 
        }

        h2 { 
            font-size: 1.3rem; 
            font-weight: 900; 
            margin: 0 0 0.5rem 0; 
            text-transform: uppercase;
            text-align: center;
        }
        
        .sub-terminal {
            color: var(--text-muted); 
            font-size: 0.75rem; 
            margin-bottom: 2rem; 
            text-align: center;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-tech);
            color: var(--text-main);
            padding: 0.85rem;
            box-sizing: border-box;
            font-size: 1.1rem;
            font-family: var(--font-scifi);
            font-weight: 700;
            margin-top: 1rem;
            text-transform: uppercase;
        }
        
        input[type="text"]::placeholder {
            color: #b0b5c0;
        }

        /* Tactical Progress Bar Layout */
        .meter-container { 
            background: #e6e9ef; 
            height: 10px; 
            margin: 1.5rem 0; 
            overflow: hidden; 
            border: 1px solid var(--border-tech);
        }
        
        .meter-bar { 
            height: 100%; 
            width: 0%; 
            background-color: var(--orange-neon); 
            transition: width 0.3s ease, background-color 0.3s ease; 
        }

        /* Metric Diagnostic Box */
        .time-box { 
            background: var(--bg); 
            padding: 1.2rem; 
            border: 1px solid var(--border-tech); 
            text-align: center; 
            margin-bottom: 1.5rem; 
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
        }
        
        .time-box .label {
            color: var(--text-muted); 
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        .time-val { 
            font-size: 1.8rem; 
            font-weight: 900; 
            color: var(--orange-neon); 
            margin-top: 0.25rem; 
            transition: color 0.3s; 
            text-transform: uppercase;
        }

        /* Structural Checklist Array */
        .check-item { 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            color: var(--text-muted); 
            margin: 0.6rem 0; 
            font-size: 0.8rem; 
            font-weight: 700;
        }
        
        .check-item.valid { 
            color: var(--text-main); 
        }
        
        .icon { 
            font-size: 0.85rem; 
            display: inline-block;
            width: 20px;
        }
    </style>
</head>
<body>

    <a href="cypher.html" class="back-btn"><span>← BACK</span></a>

    <header>
        <h1>SECURE_MATRIX // CRYPTO_CHECK</h1>
        <p>MODULE: INSTANT_CRACK_TIME_METER // SYSTEM: READY</p>
    </header>

    <div class="container">
        <h2>[ PASSWORD_ENTROPY ]</h2>
        <div class="sub-terminal">OFFLINE_ANALYZER // NO_DATA_LEAKAGE</div>
        
        <input type="text" id="pass-input" placeholder="ENTER_ACCESS_KEY..." oninput="analyzePassword()">

        <div class="meter-container">
            <div id="meter" class="meter-bar"></div>
        </div>

        <div class="time-box">
            <div class="label">ESTIMATED_BRUTE_FORCE_TIME:</div>
            <div id="crack-time" class="time-val">0 SECONDS</div>
        </div>

        <div class="check-item" id="chk-length"><span class="icon" id="ico-length">[-]</span> MIN_LENGTH_08</div>
        <div class="check-item" id="chk-upper"><span class="icon" id="ico-upper">[-]</span> UPPERCASE_CHAR</div>
        <div class="check-item" id="chk-lower"><span class="icon" id="ico-lower">[-]</span> LOWERCASE_CHAR</div>
        <div class="check-item" id="chk-num"><span class="icon" id="ico-num">[-]</span> NUMERIC_DIGIT</div>
        <div class="check-item" id="chk-spec"><span class="icon" id="ico-spec">[-]</span> SPECIAL_SYMBOL</div>
    </div>

    <script>
        function analyzePassword() {
            const pass = document.getElementById('pass-input').value;
            
            // Evaluation criteria matrix
            const checks = {
                length: pass.length >= 8,
                upper: /[A-Z]/.test(pass),
                lower: /[a-z]/.test(pass),
                num: /[0-9]/.test(pass),
                spec: /[^A-Za-z0-9]/.test(pass)
            };

            // Update UI checklist states dynamically using terminal-style markers
            let score = 0;
            for (const key in checks) {
                const row = document.getElementById(`chk-${key}`);
                const icon = document.getElementById(`ico-${key}`);
                if (checks[key]) {
                    row.classList.add('valid');
                    icon.innerText = "[+]";
                    score++;
                } else {
                    row.classList.remove('valid');
                    icon.innerText = "[-]";
                }
            }

            if(pass.length === 0) score = 0;

            // Handle strength meter color dynamic mapping safely using system colors
            const meter = document.getElementById('meter');
            const timeDisplay = document.getElementById('crack-time');
            
            const percentage = (score / 5) * 100;
            meter.style.width = `${percentage}%`;

            if (score <= 2) {
                meter.style.backgroundColor = "var(--orange-neon)"; // Critical Danger Accent
                timeDisplay.style.color = "var(--orange-neon)";
            } else if (score <= 4) {
                meter.style.backgroundColor = "var(--text-muted)"; // Cautionary Medium
                timeDisplay.style.color = "var(--text-muted)";
            } else {
                meter.style.backgroundColor = "var(--text-main)"; // Strong Terminal Complete
                timeDisplay.style.color = "var(--text-main)";
            }

            // Calculate estimated brute force processing steps
            timeDisplay.innerText = calculateCrackTime(pass, checks);
        }

        function calculateCrackTime(password, checks) {
            if (!password) return "0 SECONDS";

            let poolSize = 0;
            if (checks.lower) poolSize += 26;
            if (checks.upper) poolSize += 26;
            if (checks.num) poolSize += 10;
            if (checks.spec) poolSize += 33;
            if (poolSize === 0) poolSize = 26; 

            const combinations = Math.pow(poolSize, password.length);

            // Calculation benchmark: 100 Billion attempts/sec processing cluster
            const guessesPerSecond = 100000000000;
            const totalSeconds = combinations / guessesPerSecond;

            if (totalSeconds < 1) return "INSTANTLY";
            if (totalSeconds < 60) return `${Math.floor(totalSeconds)} SECONDS`;
            
            const minutes = totalSeconds / 60;
            if (minutes < 60) return `${Math.floor(minutes)} MINUTES`;
            
            const hours = minutes / 60;
            if (hours < 24) return `${Math.floor(hours)} HOURS`;
            
            const days = hours / 24;
            if (days < 365) return `${Math.floor(days)} DAYS`;
            
            const years = days / 365;
            if (years < 1000000) return `${Math.floor(years).toLocaleString()} YEARS`;
            
            return "CENTURIES";
        }
    </script>
</body>
</html>
