<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steganography Image Hider</title>
    <style>
        body { background: #0f0f11; color: #e1e1e6; font-family: sans-serif; text-align: center; padding: 2rem; }
        .back { display: inline-block; margin-bottom: 2rem; color: #72f1b8; text-decoration: none; }
        .container { max-width: 600px; margin: 0 auto; background: #16161a; padding: 2rem; border-radius: 12px; border: 1px solid #2d2d34; text-align: left; }
        input[type=file], textarea { width: 100%; background: #2d2d34; border: 1px solid #444; color: #fff; padding: 0.6rem; border-radius: 6px; box-sizing: border-box; margin-top: 0.5rem; margin-bottom: 1.2rem; }
        textarea { height: 80px; }
        button { background: #72f1b8; color: #0f0f11; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; margin-bottom: 1rem; }
        button:hover { background: #a2ffd6; }
        .preview-box { text-align: center; background: #0f0f11; padding: 1rem; border-radius: 8px; border: 1px dashed #444; display: none; }
        img { max-width: 100%; max-height: 250px; border-radius: 4px; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <a href="cypher.html" class="back">← Back</a>
    <div class="container">
        <h2 style="text-align: center; margin-top: 0;">🔑 Image Steganography Studio</h2>
        
        <label>1. Select Host Base Image File</label>
        <input type="file" id="image-loader" accept="image/*" onchange="loadImage(event)">

        <label>2. Text Message to Conceal inside Image Matrix</label>
        <textarea id="secret-msg" placeholder="Type payload text sequence to hide..."></textarea>
        
        <button onclick="encodeMessage()">Encode Secret Text into Pixels</button>

        <div class="preview-box" id="preview-area">
            <h4 style="margin:0;">Output Processed Asset Created!</h4>
            <p style="color:#94a3b8; font-size:0.8rem; margin:4px 0 12px 0;">Right-click below to save image or download it using button.</p>
            <a id="download-link" download="encoded-secret.png"><button style="width:auto; padding: 0.4rem 1rem; font-size:0.85rem;">Download PNG</button></a><br>
            <img id="output-img">
        </div>

        <hr style="border: 0; border-top: 1px solid #2d2d34; margin: 2rem 0;">
        <button style="background: #2d2d34; color: #fff; border: 1px solid #444;" onclick="decodeMessage()">Read Secret Content From Uploaded Image File</button>
    </div>

    <script>
        let imgCanvas = document.createElement('canvas');
        let ctx = imgCanvas.getContext('2d');
        let baseImageLoaded = false;
        let loadedImgElement = new Image();

        function loadImage(e) {
            let reader = new FileReader();
            reader.onload = function(event) {
                loadedImgElement.onload = function() {
                    imgCanvas.width = loadedImgElement.width;
                    imgCanvas.height = loadedImgElement.height;
                    ctx.drawImage(loadedImgElement, 0, 0);
                    baseImageLoaded = true;
                }
                loadedImgElement.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function encodeMessage() {
            if (!baseImageLoaded) return alert("Please upload an image first!");
            const msg = document.getElementById('secret-msg').value;
            if (!msg) return alert("Type a message to hide first!");

            // Draw clean fresh copy of image state back to memory buffer context
            ctx.clearRect(0,0,imgCanvas.width, imgCanvas.height);
            ctx.drawImage(loadedImgElement, 0, 0);

            let imgData = ctx.getImageData(0, 0, imgCanvas.width, imgCanvas.height);
            let data = imgData.data;

            // Turn text payload into absolute bin string ending inside a null byte terminal delimiter
            let binMsg = "";
            for (let i = 0; i < msg.length; i++) {
                let bin = msg.charCodeAt(i).toString(2).padStart(8, '0');
                binMsg += bin;
            }
            binMsg += "00000000"; // Null character terminal tag

            if (binMsg.length > data.length * 0.75) {
                return alert("Message size exceeds image threshold limits! Use a bigger image file.");
            }

            // Injects bits sequentially into the Least Significant Bit (LSB) of each pixel color channel
            for (let i = 0; i < binMsg.length; i++) {
                // Clear the last bit (mask out LSB) and add our message bit
                data[i] = (data[i] & 0xFE) | parseInt(binMsg[i]);
            }

            ctx.putImageData(imgData, 0, 0);

            // Output asset extraction rendering hooks
            const dataUrl = imgCanvas.toDataURL('image/png');
            document.getElementById('output-img').src = dataUrl;
            document.getElementById('download-link').href = dataUrl;
            document.getElementById('preview-area').style.display = 'block';
        }

        function decodeMessage() {
            if (!baseImageLoaded) return alert("Please upload an encoded image using step 1 file prompt!");
            
            // Re-read current canvas context pixel fields
            let imgData = ctx.getImageData(0, 0, imgCanvas.width, imgCanvas.height);
            let data = imgData.data;

            let binMsg = "";
            let decodedText = "";

            for (let i = 0; i < data.length; i++) {
                // Extract the lowest bit from the byte
                binMsg += (data[i] & 1).toString();

                if (binMsg.length === 8) {
                    let byteVal = parseInt(binMsg, 2);
                    if (byteVal === 0) break; // Break loop when null terminal character flag found
                    decodedText += String.fromCharCode(byteVal);
                    binMsg = ""; // Flush buffer array string
                }
            }

            if(decodedText.trim() === "") alert("No hidden messages found matching format syntax parameters inside pixel profiles.");
            else alert("Extracted Hidden Message:\n\n" + decodedText);
        }
    </script>
</body>
</html>
