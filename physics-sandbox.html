<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATE_TOOL // SOLAR_SIMULATOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f4f5f7; 
            --surface: #ffffff; 
            --text-main: #111215;
            --text-muted: #5c6470; 
            --orange-neon: #ff5500;
            --ct-btn:#DCDFE5;
            --border-tech: #dcdfe5; 
            --font-scifi: 'Orbitron', sans-serif;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(var(--border-tech) 1px, transparent 1px); 
            background-size: 20px 20px; 
            color: var(--text-main); 
            font-family: var(--font-scifi); 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 3rem 2rem; 
        }

        .back-btn { 
            position: absolute; 
            top: 2.5rem; 
            right: 2rem; 
            background-color: var(--orange-neon); 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.6rem 1.8rem; 
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%); 
        }

        header { 
            text-align: left; 
            margin-bottom: 3rem; 
            border-left: 3px solid var(--orange-neon); 
            padding-left: 1.5rem; 
        }
        
        h1 { 
            font-size: 2.2rem; 
            font-weight: 900; 
            margin: 0; 
            text-transform: uppercase; 
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--surface); 
            border: 1px solid var(--border-tech); 
            padding: 2rem; 
            clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%); 
            text-align: center; 
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 1.5rem; 
            margin-bottom: 2rem; 
            flex-wrap: wrap;
        }

        .config-cell { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 700; 
        }

        input[type="number"] { 
            background: #ffffff; 
            border: 1px solid var(--border-tech); 
            color: var(--text-main); 
            font-family: var(--font-scifi); 
            padding: 0.5rem; 
            width: 90px; 
            text-align: center; 
            font-size: 1.1rem; 
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .ctrl-btn { 
            background-color: var(--text-main); 
            color: #ffffff; 
            border: 1px solid var(--text-main); 
            font-family: var(--font-scifi); 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.8rem 1.8rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%); 
        }
        
        .ctrl-btn:hover { 
            background-color: var(--orange-neon); 
            border-color: var(--orange-neon); 
        }

        .ctrl-btn.secondary {
            background-color: var(--ct-btn);
            color: var(--text-muted);
            border: 1px solid var(--border-tech);
        }

        .ctrl-btn.secondary:hover {
            color: #ffffff;
            background-color: var(--text-muted);
            border-color: var(--text-muted);
        }

        .canvas-wrapper {
            background: #050507; /* Dark viewport maintained for space contrast */
            border: 1px solid var(--border-tech);
            padding: 5px;
            display: inline-block;
            margin: 0 auto;
        }

        canvas { 
            background: #050507; 
            display: block; 
        }
    </style>
</head>
<body>

    <a href="game.html" class="back-btn"><span>← BACK</span></a>

    <header>
        <h1>FATE_TOOL // SOLAR_SIMULATOR</h1>
        <p>MODULE: GRAVITATIONAL_CHAOS_ENGINE // SYSTEM: ACTIVE</p>
    </header>
    
    <div class="container">
        <div class="controls">
            <div class="config-cell">
                <input type="number" id="planetCount" value="3" min="1" max="1000">
                <span>PLANETS_MAX_1000</span>
            </div>
            <button class="ctrl-btn" onclick="resetSimulation()">SPAWN_CHAOS</button>
            <button class="ctrl-btn secondary" onclick="clearTrails()">CLEAR_TRACKING_TRAILS</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="sandbox"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        canvas.width = 640;  
        canvas.height = 360;

        const G = 4.0;             
        let planets = [];
        let globalTrails = []; 

        class Body {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = 300; 
                this.radius = 6; 
                this.color = color;
            }
        }

        function initSimulation() {
            planets = [];
            globalTrails = []; 
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            let count = parseInt(document.getElementById('planetCount').value) || 3;
            if (count > 1000) {
                count = 1000;
                document.getElementById('planetCount').value = 1000;
            }

            for (let i = 0; i < count; i++) {
                const startX = cx + (Math.random() - 0.5) * (canvas.width * 0.6);
                const startY = cy + (Math.random() - 0.5) * (canvas.height * 0.5);
                
                const vx = (Math.random() - 0.5) * 6;
                const vy = (Math.random() - 0.5) * 6;
                
                const color = `hsl(${Math.random() * 360}, 95%, 65%)`;
                planets.push(new Body(startX, startY, vx, vy, color));
            }
        }

        function resetSimulation() { initSimulation(); }
        function clearTrails() { globalTrails = []; }

        function updatePhysics() {
            for (let i = 0; i < planets.length; i++) {
                for (let j = 0; j < planets.length; j++) {
                    if (i === j) continue;

                    let dx = planets[j].x - planets[i].x;
                    let dy = planets[j].y - planets[i].y;

                    if (dx > canvas.width / 2) dx -= canvas.width;
                    if (dx < -canvas.width / 2) dx += canvas.width;
                    if (dy > canvas.height / 2) dy -= canvas.height;
                    if (dy < -canvas.height / 2) dy += canvas.height;
                    
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq) || 0.1;

                    const force = (G * planets[i].mass * planets[j].mass) / (distSq + 450);
                    
                    planets[i].vx += (force * (dx / dist)) / planets[i].mass;
                    planets[i].vy += (force * (dy / dist)) / planets[i].mass;
                }
            }

            planets.forEach(p => {
                globalTrails.push({ x: p.x, y: p.y, color: p.color });

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x += canvas.width;
                if (p.x > canvas.width) p.x -= canvas.width;
                if (p.y < 0) p.y += canvas.height;
                if (p.y > canvas.height) p.y -= canvas.height;
            });

            if (globalTrails.length > 15000) {
                globalTrails.splice(0, planets.length);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            globalTrails.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = 0.55; 
                ctx.fillRect(t.x - 2, t.y - 2, 4, 4); 
            });
            ctx.globalAlpha = 1.0; 

            planets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 14;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            });
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        initSimulation();
        loop();
    </script>
</body>
</html>
