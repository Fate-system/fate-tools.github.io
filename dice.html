<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATE_TOOL // TABLETOP_DICE_ROLLER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text-main: #111215;
            --text-muted: #5c6470;
            --orange-neon: #ff5500;
            --border-tech: #dcdfe5;
            --font-scifi: 'Orbitron', sans-serif;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(var(--border-tech) 1px, transparent 1px); 
            background-size: 20px 20px; 
            color: var(--text-main); 
            font-family: var(--font-scifi); 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 3rem 2rem; 
        }

        .back-btn { 
            position: absolute; 
            top: 2.5rem; 
            right: 2rem; 
            background-color: var(--orange-neon); 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.6rem 1.8rem; 
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: translateY(-2px); }

        header { text-align: left; margin-bottom: 3rem; border-left: 3px solid var(--orange-neon); padding-left: 1.5rem; }
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -1px; }

        .container { 
            max-width: 550px; 
            margin: 0 auto; 
            background: var(--surface); 
            border: 1px solid var(--border-tech); 
            padding: 2.5rem; 
            clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%); 
            text-align: center; 
        }

        .container h2 { font-size: 1rem; color: var(--orange-neon); margin-bottom: 1.5rem; }

        .dice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        
        .dice-btn { 
            background: var(--text-main); 
            color: #ffffff; 
            border: none; 
            padding: 1rem; 
            font-family: var(--font-scifi); 
            font-size: 0.9rem; 
            font-weight: 700; 
            cursor: pointer; 
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: background 0.2s;
        }
        .dice-btn:hover { background: var(--orange-neon); }

        .controls { margin-bottom: 2rem; font-size: 0.8rem; font-weight: 700; }
        
        input[type="number"] { 
            background: #f9f9f9; 
            border: 1px solid var(--border-tech); 
            padding: 0.5rem; 
            width: 60px; 
            text-align: center; 
            font-family: var(--font-scifi);
            font-size: 1rem;
        }

        .total-box { 
            background: #f9f9f9; 
            padding: 1.5rem; 
            border: 1px solid var(--border-tech);
        }
        
        #breakdown { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem; }
        #total-val { font-size: 4rem; font-weight: 900; color: var(--orange-neon); margin: 0; }
    </style>
</head>
<body>

    <a href="math.html" class="back-btn"><span>← BACK</span></a>

    <header>
        <h1>FATE_TOOL // TABLETOP_DICE_ROLLER</h1>
        <p style="color: var(--text-muted);">MODULE: PROBABILITY_CALC // SYSTEM: READY</p>
    </header>
    
    <div class="container">
        <h2>[ INITIALIZE_ROLL ]</h2>
        <div class="controls">
            COUNT: <input type="number" id="dice-count" value="1" min="1">
        </div>
        <div class="dice-grid">
            <button class="dice-btn" onclick="rollDice(4)">D4</button>
            <button class="dice-btn" onclick="rollDice(6)">D6</button>
            <button class="dice-btn" onclick="rollDice(8)">D8</button>
            <button class="dice-btn" onclick="rollDice(10)">D10</button>
            <button class="dice-btn" onclick="rollDice(12)">D12</button>
            <button class="dice-btn" onclick="rollDice(20)">D20</button>
        </div>
        <div class="total-box">
            <span id="breakdown">BREAKDOWN: --</span>
            <div id="total-val">00</div>
        </div>
    </div>

    <script>
        function rollDice(sides) {
            const count = parseInt(document.getElementById('dice-count').value) || 1;
            let rolls = [];
            let total = 0;
            for (let i = 0; i < count; i++) {
                let r = Math.floor(Math.random() * sides) + 1;
                rolls.push(r);
                total += r;
            }
            document.getElementById('breakdown').innerText = "BREAKDOWN: " + rolls.join(' + ');
            document.getElementById('total-val').innerText = total.toString().padStart(2, '0');
        }
    </script>
</body>
</html>
