<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATE_TOOL //  COLOR_CANVAS_PICKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text-main: #111215;
            --text-muted: #5c6470;
            --orange-neon: #ff5500;
            --border-tech: #dcdfe5;
            --font-scifi: 'Orbitron', sans-serif;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(var(--border-tech) 1px, transparent 1px); 
            background-size: 20px 20px; 
            color: var(--text-main); 
            font-family: var(--font-scifi); 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 3rem 2rem; 
            overflow-x: hidden;
        }

        .back-btn { 
            position: absolute; 
            top: 2.5rem; 
            right: 2rem; 
            background-color: var(--orange-neon); 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 0.6rem 1.8rem; 
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            transition: transform 0.2s;
            z-index: 10;
        }
        .back-btn:hover { transform: translateY(-2px); }

        header { text-align: left; margin-bottom: 3rem; border-left: 3px solid var(--orange-neon); padding-left: 1.5rem; }
        h1 { font-size: 2.2rem; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -1px; }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--surface); 
            border: 1px solid var(--border-tech); 
            padding: 2.5rem; 
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%); 
            text-align: center; 
        }

        .container h2 { font-size: 1rem; color: var(--orange-neon); margin-bottom: 0.5rem; text-transform: uppercase; }
        .container p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2rem; font-weight: 700; }

        canvas { 
            width: 100%; 
            max-width: 100%;
            height: auto; 
            cursor: crosshair;
            border: 1px solid var(--border-tech);
            margin-bottom: 2rem;
            display: block;
        }

        .preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            background: #f9f9f9;
            padding: 1.5rem;
            border: 1px solid var(--border-tech);
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border: 2px solid var(--text-main);
            background-color: #72f1b8;
            clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
        }

        .readout { text-align: left; }
        .code-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .sys-msg {
            color: var(--orange-neon);
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

    <a href="else.html" class="back-btn">← BACK</a>

    <header>
        <h1>FATE_TOOL // COLOR_CANVAS_PICKER</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0.5rem 0 0 0;">MODULE: [ RENDER_05 ] // SYSTEM: ONLINE</p>
    </header>
    
    <div class="container">
        <h2>[ SPECTRUM_SAMPLING ]</h2>
        <p>INPUT_METHOD: CLICK_OR_DRAG_TO_SAMPLE_PIXEL</p>
        
        <canvas id="color-canvas" width="650" height="320"></canvas>
        
        <div class="preview-box">
            <div class="color-swatch" id="preview-indicator"></div>
            <div class="readout">
                <div class="code-display" id="hex-string">#72F1B8</div>
                <div class="sys-msg">LOG: ACTIVE_SAMPLE_MODE</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('color-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const previewIndicator = document.getElementById('preview-indicator');
        const hexString = document.getElementById('hex-string');

        function drawSpectrum() {
            let gradientH = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradientH.addColorStop(0,    'rgba(255, 0, 0, 1)');
            gradientH.addColorStop(0.17, 'rgba(255, 255, 0, 1)');
            gradientH.addColorStop(0.34, 'rgba(0, 255, 255, 1)');
            gradientH.addColorStop(0.51, 'rgba(0, 0, 255, 1)');
            gradientH.addColorStop(0.68, 'rgba(255, 0, 255, 1)');
            gradientH.addColorStop(0.85, 'rgba(255, 0, 0, 1)');
            gradientH.addColorStop(1,    'rgba(0, 0, 0, 1)'); 
            ctx.fillStyle = gradientH;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let gradientV = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradientV.addColorStop(0,   'rgba(255, 255, 255, 1)');
            gradientV.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
            gradientV.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
            gradientV.addColorStop(1,   'rgba(0, 0, 0, 1)');
            ctx.fillStyle = gradientV;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }

        function pickColor(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);
            
            if (x < 0 || y < 0 || x > canvas.width || y > canvas.height) return;

            const imgData = ctx.getImageData(x, y, 1, 1).data;
            const hex = rgbToHex(imgData[0], imgData[1], imgData[2]);
            
            previewIndicator.style.backgroundColor = hex;
            hexString.innerText = hex;
        }

        let isDrawing = false;

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            pickColor(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) pickColor(e);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            pickColor(e);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing) pickColor(e);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDrawing = false);

        drawSpectrum();
    </script>
</body>
</html>
