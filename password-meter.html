<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Meter</title>
    <style>
        body { background: #0f0f11; color: #e1e1e6; font-family: sans-serif; text-align: center; padding: 2rem; }
        .back { display: inline-block; margin-bottom: 2rem; color: #72f1b8; text-decoration: none; }
        .container { max-width: 450px; margin: 0 auto; background: #16161a; padding: 2rem; border-radius: 12px; border: 1px solid #2d2d34; text-align: left; }
        h2 { text-align: center; margin-top: 0; }
        
        input[type=text] {
            width: 100%;
            background: #2d2d34;
            border: 1px solid #444;
            color: #fff;
            padding: 0.75rem;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1.1rem;
            font-family: monospace;
            margin-top: 1rem;
        }

        /* Strength Bar Layout */
        .meter-container { background: #2d2d34; height: 8px; border-radius: 4px; margin: 1.5rem 0; overflow: hidden; }
        .meter-bar { height: 100%; width: 0%; background: #ff5c5c; transition: width 0.3s ease, background-color 0.3s ease; }

        /* Crack Time Display */
        .time-box { background: #0f0f11; padding: 1rem; border-radius: 8px; border: 1px dashed #444; text-align: center; margin-bottom: 1.5rem; }
        .time-val { font-size: 1.8rem; font-weight: bold; color: #ff5c5c; margin-top: 0.25rem; transition: color 0.3s; }

        /* Checklist Requirements */
        .check-item { display: flex; align-items: center; gap: 0.5rem; color: #94a3b8; margin: 0.5rem 0; font-size: 0.95rem; }
        .check-item.valid { color: #72f1b8; }
        .icon { font-size: 1.1rem; }
    </style>
</head>
<body>

    <a href="cypher.html" class="back">← Back</a>

    <div class="container">
        <h2>🔒 Instant Crack-Time Meter</h2>
        <p style="color:#94a3b8; font-size:0.9rem; margin-top: -0.5rem; text-align: center;">Test your password security completely offline.</p>
        
        <input type="text" id="pass-input" placeholder="Type a password..." oninput="analyzePassword()">

        <div class="meter-container">
            <div id="meter" class="meter-bar"></div>
        </div>

        <div class="time-box">
            <div style="color: #94a3b8; font-size: 0.9rem;">Estimated Crack Time:</div>
            <div id="crack-time" class="time-val">0 seconds</div>
        </div>

        <div class="check-item" id="chk-length"><span class="icon" id="ico-length">❌</span> At least 8 characters</div>
        <div class="check-item" id="chk-upper"><span class="icon" id="ico-upper">❌</span> Contains uppercase letters</div>
        <div class="check-item" id="chk-lower"><span class="icon" id="ico-lower">❌</span> Contains lowercase letters</div>
        <div class="check-item" id="chk-num"><span class="icon" id="ico-num">❌</span> Contains numbers</div>
        <div class="check-item" id="chk-spec"><span class="icon" id="ico-spec">❌</span> Contains special characters</div>
    </div>

    <script>
        function analyzePassword() {
            const pass = document.getElementById('pass-input').value;
            
            // Check targets
            const checks = {
                length: pass.length >= 8,
                upper: /[A-Z]/.test(pass),
                lower: /[a-z]/.test(pass),
                num: /[0-9]/.test(pass),
                spec: /[^A-Za-z0-9]/.test(pass)
            };

            // Update UI checklist states dynamically
            let score = 0;
            for (const key in checks) {
                const row = document.getElementById(`chk-${key}`);
                const icon = document.getElementById(`ico-${key}`);
                if (checks[key]) {
                    row.classList.add('valid');
                    icon.innerText = "✔️";
                    score++;
                } else {
                    row.classList.remove('valid');
                    icon.innerText = "❌";
                }
            }

            // Handle an empty state safely
            if(pass.length === 0) score = 0;

            // Handle strength meter progress and color mapping
            const meter = document.getElementById('meter');
            const timeDisplay = document.getElementById('crack-time');
            
            const percentage = (score / 5) * 100;
            meter.style.width = `${percentage}%`;

            if (score <= 2) {
                meter.style.backgroundColor = "#ff5c5c"; // Red
                timeDisplay.style.color = "#ff5c5c";
            } else if (score <= 4) {
                meter.style.backgroundColor = "#ffb300"; // Orange/Yellow
                timeDisplay.style.color = "#ffb300";
            } else {
                meter.style.backgroundColor = "#72f1b8"; // Green
                timeDisplay.style.color = "#72f1b8";
            }

            // Calculate estimated brute force crack time using pool size metrics
            timeDisplay.innerText = calculateCrackTime(pass, checks);
        }

        function calculateCrackTime(password, checks) {
            if (!password) return "0 seconds";

            // Determine size of the possible characters matching criteria pool
            let poolSize = 0;
            if (checks.lower) poolSize += 26;
            if (checks.upper) poolSize += 26;
            if (checks.num) poolSize += 10;
            if (checks.spec) poolSize += 33;
            if (poolSize === 0) poolSize = 26; // Default to lowercase alpha sizing

            // Total mathematical combinations = poolSize raised to the power of password length
            const combinations = Math.pow(poolSize, password.length);

            // Assume a standard modern hacking rig executing 100 billion guesses (1e11) per second
            const guessesPerSecond = 100000000000;
            const totalSeconds = combinations / guessesPerSecond;

            if (totalSeconds < 1) return "Instantly";
            if (totalSeconds < 60) return `${Math.floor(totalSeconds)} seconds`;
            
            const minutes = totalSeconds / 60;
            if (minutes < 60) return `${Math.floor(minutes)} minutes`;
            
            const hours = minutes / 60;
            if (hours < 24) return `${Math.floor(hours)} hours`;
            
            const days = hours / 24;
            if (days < 365) return `${Math.floor(days)} days`;
            
            const years = days / 365;
            if (years < 1000000) return `${Math.floor(years).toLocaleString()} years`;
            
            return "Centuries 👑";
        }
    </script>
</body>
</html>
